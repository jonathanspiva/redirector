version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      # Minor and patch updates land as one PR; majors get their own
      npm-minor:
        update-types: ["minor", "patch"]
