# Domain Redirector Configuration - EXAMPLE
# ==========================================
# This is an example configuration file. To use:
#
# 1. Copy this file to redirects.yaml in your project root
# 2. Replace the example domains with your actual domains
# 3. Ensure your domains have hosted zones in Route 53
#
# For submodule setup, create redirects.yaml in your private repo root.

redirects:
  # Legacy brand domains -> main site
  - target: "https://www.brand-a.com"
    type: permanent
    description: "Legacy consumer brand domains"
    domains:
      - old-brand.com
      - "*.old-brand.com"    # Wildcard catches all subdomains

  # Acquired company domains -> landing page (no path preservation)
  - target: "https://www.brand-a.com/acquired"
    type: permanent
    description: "Acquired company domains"
    preservePath: false
    domains:
      - acquired-company.com
      - "*.acquired-company.com"

# Global settings (can be overridden per redirect group)
settings:
  preservePath: true    # Default: old.com/page -> target.com/page
  preserveQuery: true   # Default: old.com?ref=x -> target.com?ref=x
