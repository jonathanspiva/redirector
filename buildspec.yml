version: 0.2

env:
  variables:
    NODE_VERSION: "20"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - cd cdk && npm ci

  pre_build:
    commands:
      - echo "Running security audit..."
      - cd cdk && npm audit --audit-level=high || echo "Security audit found vulnerabilities - review before deploying to production"
      - echo "Running unit tests..."
      - cd cdk && npm test
      - echo "Running pre-flight checks..."
      - cd cdk && npm run preflight -- ../redirects.yaml

  build:
    commands:
      - echo "Deploying RedirectStack..."
      - cd cdk && npx cdk deploy RedirectStack --require-approval never --outputs-file outputs.json
      - echo "Deployment complete"

  post_build:
    commands:
      - echo "Running smoke tests..."
      - cd cdk && npm run smoke-test -- ../redirects.yaml || echo "Smoke tests completed with warnings (new domains may still be propagating)"
      - echo "Build complete"

artifacts:
  files:
    - cdk/outputs.json
  discard-paths: yes

cache:
  paths:
    - cdk/node_modules/**/*
