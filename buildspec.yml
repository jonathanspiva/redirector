version: 0.2

env:
  variables:
    NODE_VERSION: "24"

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - echo "Installing dependencies..."
      - cd "$CODEBUILD_SRC_DIR/cdk" && npm ci

  pre_build:
    commands:
      - echo "Running security audit..."
      - cd "$CODEBUILD_SRC_DIR/cdk" && npm audit --omit=dev --audit-level=high
      - echo "Running unit tests..."
      - cd "$CODEBUILD_SRC_DIR/cdk" && npm test
      - echo "Running pre-flight checks..."
      - cd "$CODEBUILD_SRC_DIR/cdk" && npm run preflight -- ../redirects.yaml

  build:
    commands:
      - echo "Deploying with CDK..."
      - cd "$CODEBUILD_SRC_DIR/cdk" && npm run deploy
      - echo "Running post-deployment smoke tests..."
      # Non-blocking: freshly created domains can take time to propagate (DNS up to 48h)
      - cd "$CODEBUILD_SRC_DIR/cdk" && npm run smoke-test -- ../redirects.yaml || echo "Smoke tests reported failures - new domains may still be propagating"
      - echo "Build complete"

artifacts:
  files:
    - cdk/outputs.json
  discard-paths: yes

cache:
  paths:
    - cdk/node_modules/**/*
