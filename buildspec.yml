version: 0.2

env:
  variables:
    NODE_VERSION: "20"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - cd cdk && npm ci

  pre_build:
    commands:
      - echo "Running security audit..."
      - cd cdk && npm audit --audit-level=high || echo "Security audit found vulnerabilities - review before deploying to production"
      - echo "Running unit tests..."
      - cd cdk && npm test
      - echo "Running pre-flight checks..."
      - cd cdk && npm run preflight -- ../redirects.yaml

  build:
    commands:
      - echo "Running smart deploy (skips deployment if redirects already work)..."
      # Set FORCE_DEPLOY=true to force deployment even if smoke tests pass
      - cd cdk && npm run smart-deploy -- ../redirects.yaml
      - echo "Build complete"

artifacts:
  files:
    - cdk/outputs.json
  discard-paths: yes

cache:
  paths:
    - cdk/node_modules/**/*
